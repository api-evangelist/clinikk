description: Clinikk (Clinikk Health Hub) is a Bangalore, India-based primary healthcare provider
  offering membership-based access to unlimited doctor consultations, free prescribed medicines
  and lab tests, 24/7 teleconsultation, and optional group health insurance in partnership with
  IndusInd General Insurance. Clinikk operates in-person Health Hubs across Bangalore alongside a
  consumer mobile app, and was surfaced as a 500 Global portfolio company. No public developer API
  surface was found during enrichment.
